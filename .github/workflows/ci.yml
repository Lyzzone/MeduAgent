name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Reject tracked local or private files
        run: |
          if git ls-files | grep -E '^(data/|\.learning-notes/|\.venv/|\.source-cache/|uploads/|logs/|\.env$)'; then
            echo "Private or local files are tracked"
            exit 1
          fi
      - name: Run tests
        run: python -m pytest -q
      - name: Run public offline cases
        run: python -m demo.run_demo
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check browser JavaScript syntax
        run: |
          node --check web/assets/app.js
          node --check web/assets/workbench.js
